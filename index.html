  :root{--noche:#1b1410;--adobe:#c98a4b;--barro:#8c4a2f;--arena:#e8d5b5;--sol:#e9a12c;
        --titulo:'Cactus','Alfa Slab One','Rockwell',Georgia,serif;--texto:'Bitter',Georgia,serif}
  *{box-sizing:border-box}
  body{margin:0;min-height:100%;background:radial-gradient(130% 90% at 50% 0%,#3a2418 0%,var(--noche) 58%,#0e0a07 100%);
    color:var(--arena);font-family:var(--texto);display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:9px;padding:14px 12px;overscroll-behavior:none;touch-action:manipulation;
    -webkit-user-select:none;user-select:none}
  #brand{font-family:'Cactus',var(--titulo);font-size:34px;letter-spacing:.03em;color:var(--adobe);line-height:1;
    text-shadow:2px 2px 0 #5a2f18,4px 4px 0 rgba(0,0,0,.35)}
  #sub{font-size:10px;letter-spacing:.34em;color:#9c7a52;text-indent:.34em;margin-top:5px;text-transform:uppercase}
  .sarape{width:min(88vw,430px);height:20px;background-repeat:repeat-x;background-size:auto 20px;opacity:.9;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='54' height='20'><g stroke='%235c6b3c' stroke-width='1.7' fill='none' stroke-linecap='round'><path d='M12 17 L5 8M12 17 L8 4M12 17 L12 3M12 17 L16 4M12 17 L19 8'/></g><circle cx='12' cy='16' r='2' fill='%23c9a24a'/><g fill='%23c98a4b'><rect x='36' y='8' width='8' height='9' rx='1'/><rect x='38.7' y='2' width='2.6' height='7'/><rect x='38.2' y='1' width='3.6' height='2'/></g><rect x='36' y='11' width='8' height='2.4' fill='%238c4a2f'/></svg>")}
  #shell{background:linear-gradient(180deg,#2e2119,#1a120d);border:1px solid #4a3527;border-radius:5px;padding:12px;
    box-shadow:0 18px 40px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.06)}
  canvas{display:block;width:min(88vw,60vh,430px);height:auto;aspect-ratio:1/1;image-rendering:pixelated;
    background:#d9c98d;border-radius:2px;box-shadow:0 0 0 6px #120c08,0 0 0 7px #6b4326,0 0 26px rgba(233,161,44,.16)}
  #pad{display:none;width:min(88vw,430px);gap:10px;align-items:center;justify-content:space-between}
  #dpad{display:grid;grid-template-columns:repeat(3,60px);grid-template-rows:repeat(3,60px);gap:4px;
    touch-action:none;flex:0 0 auto}
  .cel{border-radius:8px;display:flex;align-items:center;justify-content:center;
    font:700 20px var(--texto);color:#c9a882;background:transparent}
  .cel.ar{background:#33241a;border:1px solid #5b4130}
  .cel.mid{background:#241a13;border-radius:50%}
  .cel.on{background:#8c4a2f;color:#f6ecd4;border-color:#c98a4b}

function dpadDir(e){

  var u=(cy===0),dn=(cy===2),lf=(cx===0),rg=(cx===2);
  ejeSet('up',u);ejeSet('down',dn);ejeSet('left',lf);ejeSet('right',rg);

function envolver(l,max){
  var out=[],i,t,corte;
  for(i=0;i<l.length;i++){
    t=l[i];
    if(t===''){out.push('');continue;}
    while(t.length>max){
      corte=t.lastIndexOf(' ',max);
      if(corte<=0)corte=max;
      out.push(t.slice(0,corte));
      t=t.slice(corte).replace(/^\s+/,'');
    }
    out.push(t);
  }
  return out;
}
function fitPages(list){
  var out=[],i,j,k,pag=[];
  for(i=0;i<list.length;i++){
    var pg=list[i],esArte=(pg.art>=0),max=esArte?4:7,anc=esArte?28:26;
    var bloques=[],cur=[];
    for(k=0;k<pg.l.length;k++){
      if(pg.l[k]===''){ if(cur.length){bloques.push(envolver([cur.join(' ')],anc));cur=[];} }
      else cur.push(pg.l[k]);
    }
    if(cur.length)bloques.push(envolver([cur.join(' ')],anc));
    pag=[];
    for(k=0;k<bloques.length;k++){
      var b=bloques[k];
      if(b.length>max){
        if(pag.length){out.push({art:pg.art,t:pg.t,l:pag});pag=[];}
        var hojas=Math.ceil(b.length/max),porHoja=Math.ceil(b.length/hojas);
        for(j=0;j<b.length;j+=porHoja)out.push({art:pg.art,t:pg.t,l:b.slice(j,j+porHoja)});
        continue;}
      if(pag.length&&pag.length+1+b.length>max){out.push({art:pg.art,t:pg.t,l:pag});pag=[];}
      if(pag.length)pag.push('');
      pag=pag.concat(b);
    }
    if(pag.length)out.push({art:pg.art,t:pg.t,l:pag});
  }
  return out;
}

function startJima(){
  C=PAL.jima;slots=[];
  for(var r=0;r<3;r++)for(var c=0;c<4;c++)
    slots.push({x:32+c*32,y:54+r*32,m:Math.random()*.7,rate:(.05+Math.random()*.028)*temp.mad,dead:0,gone:0,rest:0,sd:Math.random()*6});
  plantasLeft=PLANTAS-slots.length;
  cortes=[];pinas=0;azucar=0;pasadas=0;malCorte=0;run=0;tJima=TJ;avisoT=0;mordidas=0;
  vibs=[{x:30,y:70,dir:1,spd:26,ph:0},{x:120,y:104,dir:-1,spd:31,ph:2.1},{x:70,y:134,dir:1,spd:35,ph:4.2}];
  props=[{x:16,y:70,t:0,r:6},{x:80,y:70,t:2,r:7},{x:112,y:38,t:1,r:5},
    {x:48,y:102,t:2,r:7},{x:144,y:102,t:0,r:6},{x:80,y:134,t:1,r:5}];
  player=newPlayer(80,138);parts=[];stage='jima';say('CORTA SOLO LAS MADURAS');
}
var player;
function estado(m){return m<.45?0:(m<.8?1:(m<1.15?2:3));}
function calidad(m){var e=estado(m);
  if(e===0)return .18;
  if(e===1)return .25+(m-.45)/.35*.45;
  return clamp(1-Math.abs(m-.97)/.30*.35,.62,1);}
function nearSlot(){var b=null,bd=16;
  for(var i=0;i<slots.length;i++){var s=slots[i];if(s.gone||s.dead)continue;
    var d=hyp(player.x-s.x,player.y-s.y);if(d<bd){bd=d;b=s;}}return b;}
function updJima(dt){
  run+=dt;
  if(player.stun>0)player.stun-=dt;else move(dt,60);
  for(var pr=0;pr<props.length;pr++){var o=props[pr];
    var ox=player.x-o.x,oy=player.y-o.y,od=hyp(ox,oy),rr=o.r+4;
    if(od<rr&&od>0.01){player.x=o.x+ox/od*rr;player.y=o.y+oy/od*rr;}}
  player.inv=Math.max(0,player.inv-dt);
  for(var v=0;v<vibs.length;v++){
    var s2=vibs[v];
    s2.x+=s2.dir*(s2.spd+(TJ-tJima)*.62)*dt;
    if(s2.x<PX0+12){s2.x=PX0+12;s2.dir=1;}
    if(s2.x>PX1-12){s2.x=PX1-12;s2.dir=-1;}
    s2.yy=s2.y+Math.sin(run*1.15+s2.ph)*7;
    if(player.inv<=0&&hyp(player.x-s2.x,player.y-s2.yy)<9){
      player.inv=1.6;player.stun=.55;mordidas++;tJima-=4;shake=3;
      var a2=Math.atan2(player.y-s2.yy,player.x-s2.x);
      player.x=clamp(player.x+Math.cos(a2)*12,PX0+6,PX1-6);
      player.y=clamp(player.y+Math.sin(a2)*12,PY0+6,PY1-6);
      say('¡VIBORA! -4 SEG',1);SFX.bad();fx(s2.x,s2.yy,6,'#b23a2e',24);}
  }
  tJima-=dt;
  if(!avisoT&&tJima<8){avisoT=1;say('SE ACABA LA TEMPORADA',1);SFX.pass();}
  for(var i=0;i<slots.length;i++){var s=slots[i];
    if(s.gone){s.rest-=dt;
      if(s.rest<=0&&plantasLeft>0){plantasLeft--;s.gone=0;s.m=0;s.dead=0;s.rate=(.05+Math.random()*.028)*temp.mad;}
      continue;}
    if(s.dead){s.dead-=dt;if(s.dead<=0){s.gone=1;s.rest=1.2;}continue;}
    s.m+=s.rate*dt;
    if(s.m>1.5){s.dead=.9;pasadas++;SFX.pass();say('SE PASO',1);fx(s.x,s.y,5,C.a2,20);}}
  var t=nearSlot();
  if(edge&&t){var e=estado(t.m),q=calidad(t.m);
    if(e===3){SFX.bad();say('YA SE PASO');}
    else{q=clamp(q*temp.az,0,1);pinas++;azucar+=q;cortes.push(q);
      if(e===2&&Math.abs(t.m-.97)<.09){SFX.punto();say('EN PUNTO',1);fx(t.x,t.y,9,C.hot,26);}
      else if(e===2){SFX.cut();fx(t.x,t.y,5,C.a3,22);}
      else{malCorte++;SFX.cut();say(e===0?'MUY JOVEN':'LE FALTABA');fx(t.x,t.y,4,C.a2,18);}
      fxTxt(t.x,t.y-10,'+'+q.toFixed(1),e===2?'#7a4a12':'#9c2b20');
      t.dead=.35;shake=1;}}
  var vivos=0;for(i=0;i<slots.length;i++)if(!slots[i].gone&&!slots[i].dead)vivos++;
  if(pinas>=META||tJima<=0||(plantasLeft<=0&&vivos===0)){
    azucar=pinas>0?azucar/pinas:0;
    if(pinas===0){seAcabo('NI UNA SOLA PIÑA JIMADA');edge=0;return;}
    stage='r1';SFX.stage();}
  edge=0;
}

function startHorno(){
  C=PAL.horno;
  horno={mx:80,dir:1,spd:34,open:18,left:cortes.slice(),fly:null};
  cargadas=0;fallos=0;calor=1;cocidoQ=0;run=0;desde=0;
  player=newPlayer(80,132);parts=[];stage='horno';say('ATINALE A LA BOCA');
}
function updHorno(dt){
  run+=dt;move(dt,92,116,146);
  desde+=dt;
  calor=clamp(calor-dt*(desde>1.2?.045*(desde-.9):.004),0,1);
  horno.mx+=horno.dir*horno.spd*dt;
  if(horno.mx<30){horno.mx=30;horno.dir=1;}
  if(horno.mx>130){horno.mx=130;horno.dir=-1;}
  if(edge&&horno.left.length&&!horno.fly){
    horno.fly={x:player.x,y0:player.y-8,y:player.y-8,t:0,q:horno.left.shift()};SFX.thr();desde=0;}
  if(horno.fly){var f=horno.fly;f.t+=dt;f.y=f.y0+(48-f.y0)*(f.t/.55);
    if(f.t>=.55){
      if(Math.abs(f.x-horno.mx)<horno.open/2+3){cargadas++;cocidoQ+=f.q;calor=clamp(calor+.012,0,1);SFX.into();fx(f.x,48,9,C.hot,26);shake=2;
        horno.spd=Math.min(132,horno.spd+6);}
      else{fallos++;SFX.smash();fx(f.x,52,7,C.pina,26);shake=2;calor=clamp(calor-.02,0,1);
        horno.spd=Math.min(132,horno.spd+3);}
      horno.fly=null;}}
  if(!horno.left.length&&!horno.fly){
    cocidoQ=cargadas>0?cocidoQ/cargadas:0;
    if(cargadas===0){seAcabo('NINGUNA PIÑA ENTRO AL HORNO');edge=0;return;}
    stage='r2';SFX.stage();}
  edge=0;
}
function rendimiento(){
  var cocc=clamp(.45*(cargadas/Math.max(1,cargadas+fallos))+.55*calor,0,1);
  return {cocc:cocc,total:Math.max(3,cargadas*1.6*(.55+.75*cocidoQ))};
}

function tinaEstado(t){
  if(t.closed)return 3;

  if(t.d<t.obj+.55)return 1;
  return 2;

function nearTina(){
  var b=null,bd=17;

function nearBicho(){
  var b=null,bd=13;

    var d=hyp(player.x-g.x,player.y-g.y);if(d<bd){bd=d;b=g;}}

function cerrarTina(t){

function updFermento(dt){
  run+=dt;fermRun+=dt;move(dt,60);

      lado=(lado+1)%4;

      else if(lado===1){bx=PX1-4;by=PY0+8+Math.random()*100;}

      else{bx=PX0+10+Math.random()*130;by=PY1-4;}}

var saludT=0;
function drawSalud(){
  ctx.fillStyle='#2b1d16';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#3b2a1e';ctx.fillRect(0,112,W,48);
  ctx.fillStyle='#4a3527';ctx.fillRect(0,112,W,3);
  var gx=92,gTop=98,gBot=124;
  var t=clamp((saludT-.75)/1.5,0,1);
  var tilt=clamp(saludT/.85,0,1)*1.02;
  var bx=44,by=66;
  ctx.save();ctx.translate(bx,by);ctx.rotate(tilt);
  ctx.fillStyle='#e4e8de';ctx.fillRect(-9,-16,18,42);
  ctx.fillStyle='#c9d0c4';ctx.fillRect(4,-16,5,42);
  ctx.fillStyle='#e4e8de';ctx.fillRect(-4,-30,8,15);
  ctx.fillStyle='#c9d0c4';ctx.fillRect(1,-30,3,15);
  ctx.fillStyle='#8c4a2f';ctx.fillRect(-5,-34,10,5);
  var lq=1-t;
  if(lq>0){ctx.fillStyle='#f2e3a6';ctx.fillRect(-7,26-Math.round(40*lq),14,Math.round(40*lq));}
  ctx.fillStyle='rgba(255,255,255,.5)';ctx.fillRect(-8,-14,2,38);
  ctx.fillStyle='#f6ecd4';ctx.fillRect(-8,-6,16,20);
  ctx.fillStyle='#8c4a2f';ctx.fillRect(-8,-6,16,4);
  ctx.fillStyle='#3b2a1e';ctx.font='bold 5px monospace';ctx.textAlign='center';
  ctx.fillText('VINO',0,-1);ctx.fillText('MEZCAL',0,4);ctx.fillText(result.abv+'%',0,9);
  ctx.restore();
  var mx=bx+Math.sin(tilt)*34,my=by-Math.cos(tilt)*34;
  if(t>0&&t<1){
    ctx.fillStyle='#f2e3a6';
    for(var d=0;d<6;d++){
      var f2=((run*1.1+d*.17)%1);
      var lx=mx+(gx-mx)*f2, ly=my+(gTop-my)*f2+f2*f2*4;
      ctx.fillRect(px(lx),px(ly),2,4);}
  }
  ctx.fillStyle='#e7ded0';
  ctx.beginPath();ctx.moveTo(gx-10,gTop);ctx.lineTo(gx+10,gTop);ctx.lineTo(gx+8,gBot);ctx.lineTo(gx-8,gBot);ctx.closePath();ctx.fill();
  ctx.fillStyle='#cfc4b2';ctx.fillRect(gx-9,gBot-4,18,4);
  ctx.fillStyle='#f6ecd4';ctx.fillRect(gx-9,gTop,3,gBot-gTop-4);
  if(t>0){
    var h=Math.round((gBot-6-gTop-2)*t);
    var yTop=gBot-6-h;
    var wTop=8+2*((gBot-yTop)/(gBot-gTop));
    ctx.fillStyle='#f2e3a6';
    ctx.beginPath();ctx.moveTo(gx-wTop+1.5,yTop);ctx.lineTo(gx+wTop-1.5,yTop);
    ctx.lineTo(gx+7,gBot-5);ctx.lineTo(gx-7,gBot-5);ctx.closePath();ctx.fill();
    ctx.fillStyle='#fbf3d2';ctx.fillRect(px(gx-wTop+2),px(yTop),px(wTop*2-4),1);}
  ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillRect(gx+5,gTop+3,2,gBot-gTop-10);
  ctx.textAlign='center';ctx.textBaseline='top';
  if(saludT>2){
    ctx.fillStyle='#f0b429';ctx.font='bold 16px monospace';
    ctx.fillText('¡SALUCITA!',80,22+(Math.floor(run*4)%2));
    ctx.fillStyle='#f6ecd4';ctx.font='bold 7px monospace';
    ctx.fillText('LOTE '+(lot<10?'00':'0')+lot+'   '+result.grade+'   '+result.score+' PTS',80,42);
    if(saludT>2.8)ctx.fillText(Math.floor(run*2)%2===0?'MANOS PARA CONTINUAR':' ',80,146);}
  ctx.textAlign='left';
}
var nomBox=document.getElementById('nom'),nomVis=-1;
function pedirNombre(){
  stage='nombre';
  if(nomBox){nomBox.value=maestro||'';
    setTimeout(function(){try{nomBox.focus();}catch(e){}},60);}
}
function cerrarNombre(){
  var v=(nomBox&&nomBox.value?nomBox.value:'').toUpperCase().replace(/[^A-Z0-9 .ÑÁÉÍÓÚ-]/g,'').trim();
  maestro=v.slice(0,12)||'MAESTRO';
  if(nomBox){try{nomBox.blur();}catch(e){}}
  saveAll();
  temp=sorteaTemp();
  var carta={art:-1,t:temp.n,l:['LA TEMPORADA DE ESTE LOTE:'].concat(temp.d).concat(
    ['','CADA CORRIDA TE TOCA UNA','DISTINTA.','','MANOS PARA SALIR AL PLANTIO.'])};
  goPages((lot===1?P_INTRO.concat(P_JIMA):[P_JIMA[2]]).concat([carta]),startJima,'jima');
}
if(nomBox){
  nomBox.addEventListener('focus',function(){despierta();});
  nomBox.addEventListener('keydown',function(e){
    if(e.key==='Enter'){e.preventDefault();cerrarNombre();}
    e.stopPropagation();});
}
var dlBtn=document.getElementById('dl'),dlVis=-1;
function exportarEtiqueta(){
  if(!result)return;
  try{
    var lab=document.createElement('canvas');lab.width=160;lab.height=160;
    var lc=lab.getContext('2d');if(!lc)return;
    lc.imageSmoothingEnabled=false;
    var real=ctx;ctx=lc;drawLabel(1);ctx=real;
    var tmp=document.createElement('canvas');tmp.width=180;tmp.height=320;
    var tc=tmp.getContext('2d');if(!tc)return;
    tc.imageSmoothingEnabled=false;
    tc.fillStyle='#2b1d16';tc.fillRect(0,0,180,320);
    tc.fillStyle='#3b2a1e';tc.fillRect(0,0,180,34);tc.fillRect(0,286,180,34);
    tc.fillStyle='#8c4a2f';tc.fillRect(0,34,180,1);tc.fillRect(0,285,180,1);
    tc.drawImage(lab,0,0,160,160,10,44,160,160);
    tc.textAlign='center';tc.textBaseline='top';
    tc.fillStyle='#c98a4b';tc.font='bold 9px monospace';
    tc.fillText('MI LOTE EN AGAVERO',90,13);
    tc.fillStyle='#8c7a5c';tc.font='bold 7px monospace';
    tc.fillText('AGAVERO   © MAUM 2026',90,297);
    var o=document.createElement('canvas');o.width=1080;o.height=1920;
    var oc=o.getContext('2d');if(!oc)return;
    oc.imageSmoothingEnabled=false;
    oc.mozImageSmoothingEnabled=false;oc.webkitImageSmoothingEnabled=false;
    oc.fillStyle='#2b1d16';oc.fillRect(0,0,1080,1920);
    oc.drawImage(tmp,0,0,180,320,0,0,1080,1920);
    if(LOGOHDK){
      var lw=368,lh=Math.round(lw*LOGOHD.height/LOGOHD.width);
      oc.drawImage(LOGOHD,(1080-lw)/2,1310,lw,lh);}
    var nombre='agavero-lote-'+(lot<10?'00':'0')+lot+'.png';
    var bajar=function(url,rev){
      var a=document.createElement('a');a.download=nombre;a.href=url;a.rel='noopener';
      document.body.appendChild(a);a.click();
      setTimeout(function(){try{document.body.removeChild(a);if(rev)URL.revokeObjectURL(url);}catch(e2){}},400);
    };
    if(o.toBlob){
      o.toBlob(function(blob){
        if(!blob){bajar(o.toDataURL('image/png'),0);return;}
        try{
          var f=new File([blob],nombre,{type:'image/png'});
          if(navigator.canShare&&navigator.canShare({files:[f]})&&navigator.share){
            navigator.share({files:[f],title:'AGAVERO',text:'Mi lote en AGAVERO'})['catch'](function(){
              bajar(URL.createObjectURL(blob),1);});
            return;}
        }catch(e3){}
        bajar(URL.createObjectURL(blob),1);
      },'image/png');
    }else bajar(o.toDataURL('image/png'),0);
  }catch(e){}
}
if(dlBtn)dlBtn.addEventListener('click',function(){despierta();exportarEtiqueta();});
function draw(){
  if(stage==='salud'){drawSalud();return;}
  if(stage==='intro'){drawIntro();return;}
  if(stage==='perdiste'){drawPerdiste();return;}
  if(stage==='nombre'){drawNombre();return;}
  if(stage==='pages'){drawPages();return;}
  if(stage==='label'){drawLabel();return;}
  if(stage==='iniciales'){drawIniciales();return;}
  if(stage==='tabla'){drawTabla();return;}
  if(stage==='creditos'){drawCreditos();return;}
  ctx.save();
  if(shake>0)ctx.translate((Math.random()*2-1)*shake|0,(Math.random()*2-1)*shake|0);
  if(stage==='jima'||stage==='r1')drawJima();
  else if(stage==='horno'||stage==='r2')drawHorno();
  else if(stage==='fermento'||stage==='r3')drawFermento();
  else if(stage==='troca'||stage==='r4')drawTroca();
  else drawTaberna();
  parts.forEach(function(p){
    if(p.txt){ctx.font='bold 8px monospace';ctx.textAlign='center';ctx.textBaseline='top';
      ctx.fillStyle=p.c;ctx.fillText(p.txt,px(p.x),px(p.y));ctx.textAlign='left';}
    else{ctx.fillStyle=p.c;ctx.fillRect(px(p.x),px(p.y),p.s,p.s);}});
  ctx.restore();
  if(msgT>0&&stage!=='r1'&&stage!=='r2'&&stage!=='r3'&&stage!=='r4'){
    ctx.textAlign='center';ctx.textBaseline='top';ctx.font='bold 9px monospace';
    var my=stage==='taberna'?33:19;
    ctx.fillStyle=C.ink;ctx.fillRect(18,my,124,12);
    ctx.fillStyle=msgA?C.hot:C.bone;ctx.fillText(msg,80,my+1);ctx.textAlign='left';}
  if(stage==='r1'){var est=Math.round(pinas*azucar*1.1);
    panel(temp.n,pinas+' PIÑAS   AZUCAR '+Math.round(azucar*100)+'%',
      'PASADAS '+pasadas+'  VERDES '+malCorte+'  MORDIDAS '+mordidas,'RINDEN ~'+est+' BOTELLAS');}
  if(stage==='r2'){var R=rendimiento();
    panel('EL HORNO','LLEGARON '+pinas+', SE COCIERON '+cargadas+'  ('+clamp(Math.round(cargadas/3),2,4)+' TINAS)',
      'COCCION '+Math.round(R.cocc*100)+'%   CALOR '+Math.round(calor*100)+'%',
      'DA PARA ~'+Math.round(R.total*.55)+' BOTELLAS');}
  if(stage==='r4')panel('EL CAMINO','LLEGARON '+carga+' DE '+trocaIni+' PIÑAS',
    golpes===0?'¡SIN UN SOLO GOLPE!':('GOLPES '+golpes),'MANOS: AL HORNO');
  if(stage==='r3')panel('LAS TINAS',tinas.length+' TINAS   MOSTO '+Math.round(mostoQ*100)+'%',
    avinagrado?'SE AVINAGRO UNA TINA':('CONTAMINACIONES '+contam),'ALCANZA PARA ~'+Math.round(mostoVol*.55)+' BOTELLAS');
}
/* ---------- bucle ---------- */
var last=performance.now();
function frame(now){
  var dt=Math.min(.05,(now-last)/1000);last=now;
  run+=PLAYSTAGE()?0:dt;
  shake=Math.max(0,shake-dt*20);msgT-=dt;lockT-=dt;
  if(stage==='creditos')credY+=dt*13;
  if(stage==='salud')saludT+=dt;
  if(stage==='jima')updJima(dt);
  else if(stage==='horno')updHorno(dt);
  else if(stage==='fermento')updFermento(dt);
  else if(stage==='troca')updTroca(dt);
  else if(stage==='taberna')updTaberna(dt);
  else if(stage==='pages'){
    if(edge){SFX.talk();
      if(pageI+1<pages.length)pageI++;
      else{var f2=pagesThen;pagesThen=null;f2();}}
    edge=0;}
  else if(stage==='nombre'){
    if(edgeU||edgeD||edgeL||edgeR){avatar=avatar?0:1;SFX.pick();}
    if(edge){cerrarNombre();}
    edge=0;
  }
  else if(stage==='iniciales'){
    var N=ABC.length;
    if(edgeU){initials[initI]=(initials[initI]+1)%N;SFX.pick();}
    if(edgeD){initials[initI]=(initials[initI]+N-1)%N;SFX.pick();}
    if(edgeL){initI=Math.max(0,initI-1);SFX.pick();}
    if(edgeR){initI=Math.min(4,initI+1);SFX.pick();}
    if(edge){SFX.talk();
      if(initI<4)initI++;
      else{
        var nm='';for(var q=0;q<5;q++)nm+=ABC.charAt(initials[q]);
        nm=nm.replace(/\s+$/,'')||'AGAVE';
        tabla.push({n:nm,s:result.score});
        tabla.sort(function(a,b){return b.s-a.s;});tabla=tabla.slice(0,5);
        saveAll();stage='tabla';}}
    edge=0;}
  else{
    if(edge){
      if(stage==='intro'){ if(!sonido){sonido=1;ensureAudio();musStart();}
        else if(!maestro){pedirNombre();}
        else{ temp=sorteaTemp();
          var carta={art:-1,t:temp.n,l:['LA TEMPORADA DE ESTE LOTE:'].concat(temp.d).concat(
            ['','CADA CORRIDA TE TOCA UNA','DISTINTA.','','MANOS PARA SALIR AL PLANTIO.'])};
          goPages((lot===1?P_INTRO.concat(P_JIMA):[P_JIMA[2]]).concat([carta]),startJima,'jima'); } }
      else if(stage==='r1'){goPages(lot===1?P_TRO:[P_TRO[1]],startTroca,'troca');}
      else if(stage==='r4'){goPages(lot===1?P_HORNO:[P_HORNO[2]],startHorno,'horno');}
      else if(stage==='r2'){goPages(lot===1?P_FER:[P_FER[2]],startFermento,'fermento');}
      else if(stage==='r3'){goPages(lot===1?P_TAB:[P_TAB[1]],startTaberna,'taberna');}
      else if(stage==='label'){ if(lockT<=0){saludT=0;stage='salud';SFX.label();}}
      else if(stage==='salud'){ if(saludT>2.8){
          if(esTop()){tabla.push({n:maestro||'MAESTRO',s:result.score});
            tabla.sort(function(a,b){return b.s-a.s;});tabla=tabla.slice(0,5);saveAll();}
          stage='tabla';}}
      else if(stage==='tabla'){credY=0;stage='creditos';}
      else if(stage==='nombre'){cerrarNombre();}
      else if(stage==='creditos'){lot++;stage='intro';}
      else if(stage==='perdiste'){stage='intro';}}
    edge=0;}
  edgeU=0;edgeD=0;edgeL=0;edgeR=0;
  var quiere=(stage==='label'||stage==='salud')?1:0;
  if(dlBtn&&quiere!==dlVis){dlVis=quiere;dlBtn.style.display=quiere?'block':'none';}
  var qn=(stage==='nombre')?1:0;
  if(nomBox&&qn!==nomVis){nomVis=qn;nomBox.style.display=qn?'block':'none';}
  for(var j=parts.length-1;j>=0;j--){var p=parts[j];
    p.x+=p.vx*dt;p.y+=p.vy*dt;if(!p.txt){p.vx*=.92;p.vy*=.92;}p.l-=dt;if(p.l<=0)parts.splice(j,1);}
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
